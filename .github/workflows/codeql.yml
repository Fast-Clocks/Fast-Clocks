name: CodeQL

# GitHub's own static security analysis. Free on private repos for this org tier,
# and it catches the class of defect a claims-linter cannot: injection, XSS,
# unsafe deserialisation, path traversal, hardcoded credentials in logic.
#
# Adopt in every JS/TS repo. Results land in the Security tab and, with branch
# protection on, block merges (§13 security baseline, §30 release gate).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * 1'   # Monday 02:00 AWST — new rules find old bugs
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is the widest ruleset. Use it — the estate has
          # enough half-finished code that quality findings are worth seeing.
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
