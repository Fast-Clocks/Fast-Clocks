name: APN Truth Scan

# Mechanical enforcement of the Sovereign Engineering Constitution.
# Two ways to use it:
#   1. Directly — runs on this repo's PRs and pushes.
#   2. As a reusable workflow — any APN repo can call it (see workflow_call below),
#      so there is ONE canonical implementation, not 27 copies (§7 one canonical system).
#
# To adopt in another repo, add .github/workflows/truth.yml containing:
#
#   name: Truth
#   on: [pull_request, push, workflow_dispatch]
#   jobs:
#     truth:
#       uses: Fast-Clocks/Fast-Clocks/.github/workflows/apn-truth-scan.yml@main

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      fail-on-warn:
        description: Treat advisories as blocking
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  truth-scan:
    name: Claims, secrets, CDN, finish quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Fetch canonical scanner
        run: |
          # Always use the canonical scanner, even when called from another repo.
          if [ ! -f scripts/apn-truth-scan.sh ]; then
            mkdir -p scripts
            curl -fsSL -o scripts/apn-truth-scan.sh \
              https://raw.githubusercontent.com/Fast-Clocks/Fast-Clocks/main/scripts/apn-truth-scan.sh
          fi
          chmod +x scripts/apn-truth-scan.sh

      - name: Run truth scan
        id: scan
        shell: bash
        run: |
          set +e
          # $? after a pipeline is the exit code of the LAST element — `tee`, which
          # essentially always exits 0. Reading $? here reported success no matter
          # what the scanner found, so the Enforce step below never fired: a
          # false green, on the very tool whose job is to stop false greens.
          # PIPESTATUS[0] is the scanner's own status. Requires bash, hence the
          # explicit `shell:` above (GitHub's default `sh` has no PIPESTATUS).
          APN_SCAN_REPORT=scan-report.txt ./scripts/apn-truth-scan.sh . | tee scan-output.txt
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Scanner exited $CODE"
        continue-on-error: true

      - name: Self-test the gate
        shell: bash
        run: |
          # Proves the enforcement wiring actually fails on a blocking finding.
          # Without this, "the gate works" is an assumption, not a tested property.
          set +e
          TMP=$(mktemp -d)
          git -C "$TMP" init -q .
          printf 'DATABASE_PASSWORD="x"\n' > "$TMP/.env.local"
          git -C "$TMP" add -A
          git -C "$TMP" -c user.email=t@t -c user.name=t commit -qm t
          # Run it through the SAME pipeline shape the real step uses. Testing the
          # scanner directly would prove detection but not the wiring — and the
          # wiring is what broke. `| tee` is what silently swallowed the status.
          ./scripts/apn-truth-scan.sh "$TMP" 2>&1 | tee /dev/null > /dev/null
          SEEDED=${PIPESTATUS[0]}
          NAIVE=$?   # what the old buggy code read — kept to prove the trap is real
          rm -rf "$TMP"
          if [ "$SEEDED" != "1" ]; then
            echo "::error::Gate self-test FAILED — a seeded blocking finding returned $SEEDED, expected 1."
            echo "The scanner is not detecting blocking findings. Do not trust a green run."
            exit 1
          fi
          if [ "$NAIVE" = "1" ]; then
            echo "::warning::\$? now equals PIPESTATUS[0]; the pipeline shape may have changed."
          fi
          echo "Gate self-test passed: seeded blocking finding returned exit 1 through the real pipeline."
          echo "(For the record, bare \$? on that same pipeline returned $NAIVE — the original bug.)"

      - name: Publish to job summary
        if: always()
        run: |
          {
            echo "## APN Truth Scan"
            echo ""
            echo '```'
            cat scan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '## APN Truth Scan\n\n```\n'
              + fs.readFileSync('scan-output.txt', 'utf8').slice(0, 60000)
              + '\n```\n\n_Constitution §3 no test = no claim · §13 secrets · §23 website quality · §25 writing_';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find(c => c.body.startsWith('## APN Truth Scan'));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Enforce
        if: always()
        run: |
          CODE="${{ steps.scan.outputs.exit_code }}"
          if [ "$CODE" = "1" ]; then
            echo "::error::Truth scan found BLOCKING issues. §30 release gate: do not release."
            exit 1
          fi
          if [ "$CODE" = "2" ] && [ "${{ inputs.fail-on-warn }}" = "true" ]; then
            echo "::error::Advisories present and fail-on-warn is enabled."
            exit 1
          fi
          echo "Truth scan passed."
