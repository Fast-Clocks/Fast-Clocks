name: APN Daily Estate Scan

# The daily checkup across the WHOLE estate. Runs every repo through the truth scan,
# then writes ONE issue — today's fix list — so the next session opens with a
# prioritised list instead of re-discovering the estate from zero.
#
# This is the machinery the Constitution has always lacked: §4 pre-build gate and
# §23 website quality become things that RUN, not things an agent may forget to read.
#
# The issue is UPDATED in place, never duplicated (§7 one canonical system).

on:
  schedule:
    - cron: '0 20 * * *'   # 20:00 UTC = 04:00 AWST (Perth) — list ready before the day starts
  workflow_dispatch:
    inputs:
      repos:
        description: 'Space-separated repo names to scan (blank = all)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: apn-daily-estate-scan
  cancel-in-progress: false

jobs:
  discover:
    name: Discover repos
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: List all org repos
        id: list
        env:
          # APN_ESTATE_TOKEN must be READ-ONLY: Contents:read + Metadata:read, nothing else.
          # This job only ever reads. It must never hold write, and it is a different
          # credential from whatever self-heal uses — self-heal opens PRs, this does not.
          #
          # Preferred: a GitHub App installed on an explicit list of repositories, so
          # revocation and scope are managed in one place and the token is short-lived.
          # Acceptable: a fine-grained PAT restricted to selected repositories.
          # Not acceptable: a classic PAT with `repo` scope — that grants write to
          # everything the account can reach, for a job that only needs to read.
          #
          # Falls back to GITHUB_TOKEN, which can only see THIS repo — so without the PAT
          # the estate scan silently becomes a single-repo scan. That is exactly the kind of
          # silent narrowing that has cost months. It is called out loudly in the report.
          GH_TOKEN: ${{ secrets.APN_ESTATE_TOKEN || github.token }}
        run: |
          if [ -n "${{ inputs.repos }}" ]; then
            REPOS="${{ inputs.repos }}"
          elif [ -n "${{ secrets.APN_ESTATE_TOKEN }}" ]; then
            REPOS=$(gh repo list Fast-Clocks --limit 200 --json name -q '.[].name' | tr '\n' ' ')
          else
            REPOS="${{ github.event.repository.name }}"
            echo "::warning::APN_ESTATE_TOKEN not set — scanning THIS REPO ONLY, not the estate."
          fi
          echo "Discovered: $REPOS"
          JSON=$(printf '%s\n' $REPOS | jq -R . | jq -sc .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.repo }}
    needs: discover
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout scanner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Checkout target repo
        id: target
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Fast-Clocks/${{ matrix.repo }}
          token: ${{ secrets.APN_ESTATE_TOKEN || github.token }}
          path: target
          fetch-depth: 1

      - name: Scan
        if: steps.target.outcome == 'success'
        shell: bash
        run: |
          chmod +x scripts/apn-truth-scan.sh
          set +e
          APN_SCAN_JSON="evidence-${{ matrix.repo }}.json" \
            ./scripts/apn-truth-scan.sh target > "result-${{ matrix.repo }}.txt" 2>&1
          echo "$?" > "code-${{ matrix.repo }}.txt"
          cat "result-${{ matrix.repo }}.txt"

      - name: Record unreachable
        if: steps.target.outcome != 'success'
        shell: bash
        run: |
          echo "UNREACHABLE — no access with the token in use. NOT a finding about the repo." \
            > "result-${{ matrix.repo }}.txt"
          echo "3" > "code-${{ matrix.repo }}.txt"
          # Still emit evidence, so the report can distinguish "we looked and it was
          # clean" from "we never looked". Those are not the same claim.
          printf '{"root":"%s","files_inspected":0,"head_sha":"unknown","head_age_days":null,"blocking":0,"advisory":0,"unreachable":true,"checks":[]}\n' \
            "${{ matrix.repo }}" > "evidence-${{ matrix.repo }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ matrix.repo }}
          path: |
            result-${{ matrix.repo }}.txt
            code-${{ matrix.repo }}.txt
            evidence-${{ matrix.repo }}.json
          retention-days: 14

  report:
    name: Write today's fix list
    needs: [discover, scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true

      - name: Build report
        id: build
        shell: bash
        env:
          # THE ALARM BUDGET. A daily list of 200 correct findings across 27 repos
          # is not a working system — nobody reads it, so nothing gets fixed, and
          # the scan has failed even though every single finding was accurate.
          # This caps how many ADVISORY repos are written up in full per run.
          # Blocking failures are never budgeted away; suppressed items are always
          # named and counted, never silently dropped.
          ALARM_BUDGET: ${{ vars.APN_ALARM_BUDGET || 10 }}
        run: |
          python3 scripts/apn-estate-report.py results report.md >> "$GITHUB_OUTPUT"

      - name: Open or update today's issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8').slice(0, 65000);
            const title = 'APN Estate — daily fix list';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'apn-estate-scan',
            });
            if (open.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
              core.notice(`Updated issue #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['apn-estate-scan'],
              });
              core.notice(`Opened issue #${created.number}`);
            }
